name: FoodDiary
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
targets:
  FoodDiary:
    type: application
    platform: iOS
    sources:
      - FoodDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinokafuu.fooddiary.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 食迹
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  FoodDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FoodDiaryTests
    dependencies:
      - target: FoodDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinokafuu.fooddiary.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
  FoodDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FoodDiaryUITests
    dependencies:
      - target: FoodDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinokafuu.fooddiary.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
schemes:
  FoodDiary:
    build:
      targets:
        FoodDiary: all
    test:
      config: Debug
      targets:
        - FoodDiaryTests
        - FoodDiaryUITests
