name: FoodDiary
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
targets:
  FoodDiary:
    type: application
    platform: iOS
    sources:
      - FoodDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinokafuu.fooddiary.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 食迹
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  FoodDiaryVisualTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FoodDiaryVisualTests
    dependencies:
      - target: FoodDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: FoodDiary
schemes:
  FoodDiary:
    build:
      targets:
        FoodDiary: all
        FoodDiaryVisualTests: [test]
    test:
      targets: [FoodDiaryVisualTests]
