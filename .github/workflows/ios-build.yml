name: iOS unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew list --versions xcodegen || brew install xcodegen
          xcodegen --version

      - name: Build and verify unsigned IPA
        run: bash scripts/build-ios-unsigned.sh

      - name: Test local storage on an iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          runtimes = json.load(sys.stdin)["devices"]
          for runtime, devices in reversed(runtimes.items()):
              if ".iOS-" in runtime:
                  for device in devices:
                      if device["name"].startswith("iPhone") and device["isAvailable"]:
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')"
          xcodebuild \
            -project FoodDiary.xcodeproj \
            -scheme FoodDiary \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/FoodDiary-tests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload unsigned IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: FoodDiary-unsigned-ipa-${{ github.sha }}
          path: build/FoodDiary-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
